# Render Blueprint — Parchhai is a fully static site (no API, no database).
# Create from: Render Dashboard → New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: parchhai-web
    runtime: static
    buildCommand: npm i -g pnpm@10.28.2 && pnpm install --no-frozen-lockfile && pnpm --filter @parchhai/web exec vite build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: false
    # SPA fallback: serve index.html for client-side routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
